<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Minimal YouTube</title>
        <link rel="stylesheet" href="./popup.css" />
    </head>
    <body>
        <main>
            <header class="brand">
                <svg class="brand__mark" viewBox="0 0 40 30" aria-hidden="true">
                    <rect width="40" height="30" rx="10" fill="currentColor" />
                    <path d="m16 9 11 6-11 6z" fill="#fff" />
                </svg>
                <h1>Minimal YouTube</h1>
            </header>
            <!-- Only the name is text; the controls are symbols with spoken labels. -->
            <label class="card setting" for="toggle" title="Focus mode">
                <svg class="card__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /></svg>
                <span id="setting-title" class="visually-hidden">Focus mode</span>
                <span id="status" class="visually-hidden" aria-live="polite">Loading…</span>
                <span id="error" class="setting__error" role="alert" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v6M12 16.5v.5" /></svg><span class="visually-hidden"></span></span>
                <span class="switch">
                    <input id="toggle" type="checkbox" role="switch" disabled aria-labelledby="setting-title" aria-describedby="status error" />
                    <span class="switch__track" aria-hidden="true"></span>
                </span>
            </label>
            <button id="diagnostics" class="card logs" type="button" aria-label="Copy diagnostic report" title="Copy diagnostic report">
                <svg class="card__icon logs__icon logs__icon--copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg>
                <svg class="card__icon logs__icon logs__icon--busy" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 8 8" /></svg>
                <svg class="card__icon logs__icon logs__icon--done" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
                <svg class="card__icon logs__icon logs__icon--error" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
            </button>
            <span id="diagnostics-status" class="visually-hidden" role="status"></span>
        </main>
        <script src="./diagnostics.js"></script>
        <script src="./popup.js"></script>
    </body>
</html>
